<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eden Cemetery — Notable Burials</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1B1712;--char:#1C1B19;--gold:#EFC94C;--golddk:#8A6D12;--cream:#F5F4F0;--panel:#FFFFFF;--line:#DDDAD0;--body:#4A4438;--mute:#6E6759;--dline:#3A3833;--dmute:#CFCCC4}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:'Instrument Sans',system-ui,sans-serif;background:var(--cream);color:var(--ink)}
  #app{display:flex;flex-direction:column;height:100%}

  header{background:var(--char);color:#F6F4EA;padding:14px 20px;display:flex;align-items:baseline;gap:8px 18px;flex-wrap:wrap;z-index:1200;border-bottom:1px solid var(--dline)}
  header h1{font-family:'Bricolage Grotesque',sans-serif;font-size:19px;margin:0;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
  header h1 b{color:var(--gold);font-weight:600}
  header .sub{font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--dmute)}

  #bar{display:flex;gap:8px;align-items:center;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;z-index:1100}
  #q{flex:1 1 220px;max-width:340px;padding:10px 14px;border:1px solid var(--line);border-radius:0;background:var(--panel);font-family:inherit;font-size:14px;color:var(--ink)}
  #q::placeholder{color:#9A9486}
  #q:focus{outline:none;border-color:var(--golddk)}

  .chip{border:1px solid var(--line);border-radius:0;padding:7px 12px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;background:var(--panel);color:var(--body);user-select:none;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
  .chip:hover{border-color:var(--golddk)}
  .chip .dot{width:8px;height:8px;border-radius:50%;flex:none}
  .chip.off{opacity:.32}
  .chip.sel{border-color:var(--golddk);background:var(--char);color:var(--gold)}

  #tg{margin-left:auto;display:flex;border:1px solid var(--line);border-radius:0;overflow:hidden}
  #tg button{border:0;padding:8px 16px;font-family:inherit;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;cursor:pointer;background:var(--panel);color:var(--body)}
  #tg button.on{background:var(--char);color:var(--gold)}

  #maps{flex:1;min-height:0;position:relative;background:var(--cream)}
  #mapB,#mapS{position:absolute;inset:0}
  #mapB{background:var(--cream)}
  .hidden{display:none!important}


  .leaflet-container{font-family:'Instrument Sans',system-ui,sans-serif;background:var(--cream)}
  .leaflet-control-zoom a{border-radius:0!important;color:var(--ink)!important;border-color:var(--line)!important;font-family:'Instrument Sans',sans-serif}
  .leaflet-control-zoom a:hover{background:var(--cream)!important}
  .leaflet-bar{border:1px solid var(--line)!important;box-shadow:none!important}

  .sec-label{display:flex;align-items:center;justify-content:center;pointer-events:none}
  .sec-label span{font-family:'Bricolage Grotesque',sans-serif;font-size:11px;font-weight:600;letter-spacing:.22em;color:#FCFAF2;white-space:nowrap;text-shadow:0 1px 4px rgba(0,0,0,.95),0 0 12px rgba(0,0,0,.6)}
  /* Crisp the drawn plan: drop the yellow cast, harden the linework. Geometry untouched. */
  #mapB .leaflet-image-layer{filter:grayscale(1) contrast(1.42) brightness(1.08)}
  .sec-label.plan span{color:var(--ink);text-shadow:0 0 3px #F5F4F0,0 0 7px #F5F4F0,0 1px 0 #F5F4F0}
  .sec-label.tiny span{font-size:9px;letter-spacing:.16em}

  .leaflet-tooltip{font-family:'Instrument Sans',sans-serif;font-size:11.5px;letter-spacing:.06em;background:var(--char);color:#F6F4EA;border:0;border-radius:0;box-shadow:none;padding:5px 10px}
  .leaflet-tooltip-top:before{border-top-color:var(--char)}

  .popup .leaflet-popup-content-wrapper{background:var(--panel);border-radius:0;border:1px solid var(--line);box-shadow:0 10px 34px rgba(27,23,18,.22)}
  .popup .leaflet-popup-tip{background:var(--panel);border:1px solid var(--line);box-shadow:none}
  .popup .leaflet-popup-content{margin:0;width:270px!important}
  .popup .leaflet-popup-scrolled{border:0;scrollbar-width:thin}
  .popup a.leaflet-popup-close-button{color:var(--mute);top:8px;right:8px}

  .card{padding:12px 13px 11px}
  .card .cat{display:inline-block;font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:#FCFAF2;padding:3px 7px;border-radius:0;margin-bottom:7px}
  .card h2{font-family:'Bricolage Grotesque',sans-serif;font-weight:600;margin:0 0 2px;font-size:16px;color:var(--ink);line-height:1.15}
  .card .dates{font-family:'Bricolage Grotesque',sans-serif;color:var(--mute);font-size:12px;font-style:italic;margin-bottom:6px}
  .card .plot{font-size:8.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--mute);background:none;border-top:1px solid var(--line);border-radius:0;padding:7px 0 0;margin:8px 0 0;display:block}
  .card .bio{font-size:11.5px;line-height:1.55;color:var(--body);margin:6px 0}
  .card .extra{font-size:10px;line-height:1.5;color:var(--mute);font-style:italic;margin-top:5px}
  .card img{width:100%;height:auto;max-height:230px;object-fit:contain;background:#EDEBE4;border-radius:0;margin:6px 0;border:1px solid var(--line);display:block}
  .card .war{font-size:10.5px;line-height:1.5;color:var(--body);margin:6px 0;padding-left:9px;border-left:2px solid var(--gold)}
  .card .links{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}
  .card .links a{font-size:9px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--golddk);text-decoration:none;border:1px solid var(--line);padding:6px 9px;border-radius:0}
  .card .links a:hover{background:var(--char);border-color:var(--char);color:var(--gold)}

  .leaflet-control-attribution{background:rgba(245,244,240,.92)!important;border:1px solid var(--line);border-right:0;border-bottom:0;border-radius:0!important;font-family:'Instrument Sans',sans-serif!important;font-size:9.5px!important;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)!important;padding:4px 9px!important}
  .leaflet-control-attribution a{color:var(--golddk)!important;text-decoration:none}
  .leaflet-control-scale-line{background:rgba(245,244,240,.92)!important;border:1px solid var(--line)!important;border-top:0!important;border-radius:0!important;font-family:'Instrument Sans',sans-serif!important;font-size:9.5px!important;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)!important;padding:2px 7px!important;line-height:1.5}
  .northarrow{display:flex;flex-direction:column;align-items:center;gap:1px;background:rgba(245,244,240,.92);border:1px solid var(--line);padding:6px 8px 5px;color:var(--golddk)}
  .northarrow span{font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:10px;letter-spacing:.14em;color:var(--ink)}
  #trace{position:fixed;top:0;right:0;bottom:0;width:290px;z-index:3000;background:var(--panel);border-left:1px solid var(--line);padding:16px;overflow:auto;display:flex;flex-direction:column;gap:10px;font-size:12px}
  #trace h3{font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:15px;margin:0;letter-spacing:.04em;text-transform:uppercase}
  #trace .row{display:flex;flex-direction:column;gap:4px}
  #trace label{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}
  #trace input,#trace select,#trace textarea{font-family:'Instrument Sans',sans-serif;font-size:12px;padding:7px 9px;border:1px solid var(--line);border-radius:0;background:var(--panel);color:var(--ink);outline:none;width:100%}
  #trace input:focus,#trace select:focus{border-color:var(--golddk)}
  #trace textarea{height:150px;font-family:ui-monospace,Menlo,monospace;font-size:10px;resize:vertical}
  #trace .btns{display:flex;gap:6px;flex-wrap:wrap}
  #trace button{flex:1;font-family:'Instrument Sans',sans-serif;font-size:9.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:8px 6px;border:1px solid var(--line);border-radius:0;background:var(--panel);color:var(--body);cursor:pointer;white-space:nowrap}
  #trace button:hover{background:var(--char);border-color:var(--char);color:var(--gold)}
  #trace #tCount{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 0}
  #trace .hint{font-size:11px;line-height:1.5;color:var(--mute);margin:0}
  #trace ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px}
  #trace li{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--body);border:1px solid var(--line);padding:5px 7px}
  #trace li b{font-weight:600}
  #trace li span{color:var(--mute);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase}
  body.tracing #app{width:calc(100% - 290px)}
  body.tracing .leaflet-container{cursor:crosshair}
  .note{position:absolute;bottom:8px;left:10px;z-index:1000;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);background:rgba(245,244,240,.9);border:1px solid var(--line);padding:5px 10px;border-radius:0;pointer-events:none}
  @media(max-width:640px){header h1{font-size:16px}.popup .leaflet-popup-content{width:230px!important}#bar{padding:10px 14px}}
</style>
</head>

</div>
</div>

function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function card(p){
  const col=GROUPS[p.g][1];
  let h='<div class="card"><span class="cat" style="background:'+col+'">'+esc(GROUPS[p.g][0])+'</span>';
  h+='<h2>'+esc(p.n)+'</h2>';
  if(p.d)h+='<div class="dates">'+esc(p.d)+'</div>';
  if(p.pic)h+='<img loading="lazy" src="'+p.pic+'" onerror="this.remove()">';
  if(p.bio)h+='<div class="bio">'+esc(p.bio)+'</div>';
  if(p.war)h+='<div class="war">'+esc(p.war)+'</div>';
  h+='<div class="plot">Section '+esc(p.sec)+' · Lot '+esc(p.lot)+'</div>';
  if(p.extra)h+='<div class="extra">'+esc(p.extra)+'</div>';
  h+='<div class="links">';
  if(p.hist)h+='<a target="_blank" rel="noopener" href="'+p.hist+'">Learn more</a>';
  if(p.picpage)h+='<a target="_blank" rel="noopener" href="'+p.picpage+'">View photo</a>';
  return h+'</div></div>';

  const s=(p.sec||'').toLowerCase(); if(!s)continue;
  let k=SECKEYS.find(x=>x.toLowerCase()===s);
  if(!k){ const c=SECKEYS.filter(x=>s.includes(x.toLowerCase())); if(c.length) k=c.sort((a,b)=>b.length-a.length)[0]; }
  if(!k){ const last=s.split(/\s+/).pop(); k=SECKEYS.find(x=>x.toLowerCase().split(/\s+/).includes(last)); }
  if(k) SECCOUNT[k]=(SECCOUNT[k]||0)+1;
}
const SECPIN=['Lebanon','Olive','Celestine'];
const secRank=s=>{const p=SECPIN.indexOf(s.name);return p>=0?1e6-p:(SECCOUNT[s.name]||0)*1000+Math.min(s.area*1e8,999);};

function drawSections(map,plan){
  const out=[];
  for(const [name,q] of Object.entries(SECTIONS)){
    const bb=L.latLngBounds(q), ctr=bb.getCenter();
    const mk=L.marker(ctr,{icon:L.divIcon({className:'sec-label'+(plan?' plan':'')+(TINY.includes(name)?' tiny':''),
      html:'<span>'+name.toUpperCase()+'</span>'}),interactive:false});
    out.push({name,mk,area:Math.abs((bb.getEast()-bb.getWest())*(bb.getNorth()-bb.getSouth()))});
  }
  return out;
}
const LABELS_S=drawSections(mapS,false);
const NorthArrow=L.Control.extend({options:{position:'topright'},onAdd:function(){
  const d=L.DomUtil.create('div','northarrow'); d.innerHTML='<span>N</span><svg width="13" height="20" viewBox="0 0 13 20" aria-hidden="true"><path d="M6.5 0 L12 20 L6.5 15 L1 20 Z" fill="currentColor"/></svg>'; return d;}});
mapS.addControl(new NorthArrow());

/* Section names pile up at whole-cemetery zoom (centroids ~40px apart, labels 70-160px wide).
   Place the highest-ranked first and drop any label colliding with one already placed; every
   section keeps a tick + tooltip so it stays discoverable at any zoom. */
function declutter(map,pane,labels){
  if(pane.classList.contains('hidden')||!labels.length)return;
  for(const s of labels) if(!map.hasLayer(s.mk)) s.mk.addTo(map);
  const base=pane.getBoundingClientRect(), placed=[], boxes=new Map();
  const order=labels.slice().sort((a,b)=>secRank(b)-secRank(a));
  for(const s of order){
    const el=s.mk.getElement(); if(!el)continue;
    const r=(el.firstElementChild||el).getBoundingClientRect();
    boxes.set(s,{x1:r.left-base.left-5,y1:r.top-base.top-3,x2:r.right-base.left+5,y2:r.bottom-base.top+3});
  }
  for(const s of order){
    const b=boxes.get(s); if(!b)continue;
    const hit=placed.some(p=>!(b.x2<p.x1||b.x1>p.x2||b.y2<p.y1||b.y1>p.y2));
    if(hit) map.removeLayer(s.mk); else placed.push(b);
  }
}
let qS=false;
function queueS(){ if(qS)return; qS=true; requestAnimationFrame(()=>{qS=false;declutter(mapS,dS,LABELS_S);}); }
mapS.on('zoomend',queueS); mapS.on('moveend',queueS);

/* ---- dots ---- */
const mB=[],mS=[];
for(const p of PEOPLE){
  const col=GROUPS[p.g][1];
  const a=L.circleMarker([IMGH-p.by,p.bx],{radius:6,color:'#FFFFFF',weight:1.8,fillColor:col,fillOpacity:.96});
  const b=L.circleMarker([p.lat,p.lng],{radius:6,color:'#F5F4F0',weight:1.8,fillColor:col,fillOpacity:.95});
  for(const m of [a,b]){
    m.bindPopup(card(p),{className:'popup',maxWidth:290,maxHeight:360,autoPanPaddingTopLeft:[14,30],autoPanPaddingBottomRight:[14,14]}).bindTooltip(p.n,{direction:'top',offset:[0,-6]});
    m.on('mouseover',()=>m.setStyle({radius:8.5,weight:2.5}));
    m.on('mouseout',()=>m.setStyle({radius:6,weight:1.8}));
  }
  a.addTo(mapB); b.addTo(mapS); mB.push(a); mS.push(b);
}
const EDEN=L.featureGroup(mS).getBounds().pad(.12);
/* Fit only once the pane actually has a size - a zero-size first frame would otherwise
   set the guard, leave the map without a view, and lock it there. */
function fitOnce(map,pane,after){
  if(pane.classList.contains('hidden')||map._edenFitted)return;
  const c=map.getContainer();
  if(!c.clientWidth||!c.clientHeight){ requestAnimationFrame(()=>fitOnce(map,pane,after)); return; }
  map.invalidateSize();
  map.fitBounds(EDEN);
  map._edenFitted=true;
  L.control.scale({imperial:true,metric:false,position:'bottomright'}).addTo(map);
  after();
}
function fitSat(){ fitOnce(mapS,dS,queueS); }

/* ---- filters ---- */
const box=document.getElementById('chips');const sel=new Set(),chipEls={};
for(const [g,[label,col]] of Object.entries(GROUPS)){
  if(!PEOPLE.some(p=>p.g===g))continue;
  const c=document.createElement('span');
  c.className='chip'; c.innerHTML='<span class="dot" style="background:'+col+'"></span>'+label;
  c.onclick=()=>{ sel.has(g)?sel.delete(g):sel.add(g); syncChips(); refresh(); };
  chipEls[g]=c; box.appendChild(c);
}
function syncChips(){
  const none=sel.size===0;
  for(const g in chipEls){
    chipEls[g].classList.toggle('sel', sel.has(g));
    chipEls[g].classList.toggle('off', !none && !sel.has(g));
  }
}
const q=document.getElementById('q'); q.addEventListener('input',refresh);
function refresh(){
  const t=q.value.trim().toLowerCase(); let last=null,n=0;
  for(let i=0;i<PEOPLE.length;i++){
    const p=PEOPLE[i];
    const ok=(sel.size===0||sel.has(p.g))&&(!t||p.n.toLowerCase().includes(t)||(p.bio||'').toLowerCase().includes(t)||p.sec.toLowerCase().includes(t));
    if(ok){ if(!mapB.hasLayer(mB[i]))mB[i].addTo(mapB); if(!mapS.hasLayer(mS[i]))mS[i].addTo(mapS); last=i; n++; }
    else { mapB.removeLayer(mB[i]); mapS.removeLayer(mS[i]); }
  }
  if(t&&n===1&&last!==null){
    if(dS.classList.contains('hidden')){mapB.setView(mB[last].getLatLng(),0.75);mB[last].openPopup();}
    else{mapS.setView(mS[last].getLatLng(),19);mS[last].openPopup();}
  }
}
/* ---- toggle ---- */
const dB=document.getElementById('mapB'),dS=document.getElementById('mapS');
const bB=document.getElementById('bB'),bS=document.getElementById('bS');
function setMode(m){
  if(m==='sat'){dS.classList.remove('hidden');dB.classList.add('hidden');bS.classList.add('on');bB.classList.remove('on');mapS.invalidateSize();fitSat();}
  else{dB.classList.remove('hidden');dS.classList.add('hidden');bB.classList.add('on');bS.classList.remove('on');mapB.invalidateSize();mapB.fitBounds(PLANB);}
}
bB.onclick=()=>setMode('map'); bS.onclick=()=>setMode('sat');
requestAnimationFrame(()=>{mapB.invalidateSize();mapB.fitBounds(PLANB);});

/* ---- Tracing mode (?trace=1) - capture section outlines, drives and the perimeter by
   clicking. Records in the active view's coordinate space: image coords on the Plan so the
   shapes match the drawing exactly, lat/lng on Satellite. Never shown to visitors. ---- */
let traceOn=false;
function initTrace(){
  if(traceOn)return; traceOn=true;
  const KEY='edenTrace.v1';
  let shapes=[]; try{ shapes=JSON.parse(localStorage.getItem(KEY)||'[]'); }catch(e){ shapes=[]; }
  let cur=[];
  const gB=L.layerGroup().addTo(mapB), gS=L.layerGroup().addTo(mapS);
  const P=document.createElement('div'); P.id='trace';
  P.innerHTML='<h3>Trace</h3>'+
    '<div class="row"><label>Kind</label><select id="tKind"><option value="section">Section outline</option><option value="drive">Drive / path</option><option value="perimeter">Perimeter</option></select></div>'+
    '<div class="row"><label>Name</label><input id="tName" placeholder="e.g. Lebanon"></div>'+
    '<div class="btns"><button id="tFinish">Finish shape</button><button id="tUndo">Undo point</button></div>'+
    '<div class="btns"><button id="tDel">Delete last</button><button id="tClear">Clear all</button></div>'+
    '<div id="tCount"></div><ul id="tList"></ul>'+
    '<textarea id="tOut" readonly></textarea>'+
    '<div class="btns"><button id="tCopy">Copy JSON</button><button id="tDown">Download</button></div>'+
    '<p class="hint">Click the map to drop points. <b>Enter</b> finishes a shape, <b>Backspace</b> removes the last point. Trace on the <b>Plan</b> view so the outlines match the drawing.</p>';
  document.body.appendChild(P); document.body.classList.add('tracing');
  requestAnimationFrame(()=>{mapB.invalidateSize();mapS.invalidateSize();mapB.fitBounds(PLANB);});
  const $=id=>document.getElementById(id);
  const planSpace=()=>dS.classList.contains('hidden');
  const COL={section:'#8A6D12',drive:'#b03a2e',perimeter:'#1e8449'};

  function save(){ try{ localStorage.setItem(KEY,JSON.stringify(shapes)); }catch(e){} }
  function draw(){
    gB.clearLayers(); gS.clearLayers();
    const plan=planSpace(), g=plan?gB:gS, map=plan?mapB:mapS, space=plan?'plan':'gps';
    for(const s of shapes){
      if(s.space!==space)continue;
      const o={color:COL[s.kind]||'#8A6D12',weight:2,opacity:.95};
      (s.kind==='drive'?L.polyline(s.pts,o):L.polygon(s.pts,{...o,fillOpacity:.08,fillColor:o.color})).addTo(g);
    }
    if(cur.length){
      const o={color:'#EFC94C',weight:2,dashArray:'4 3'};
      if(cur.length>1) L.polyline(cur,o).addTo(g);
      for(const p of cur) L.circleMarker(p,{radius:3.5,weight:1.5,color:'#1C1B19',fillColor:'#EFC94C',fillOpacity:1}).addTo(g);
    }
    const pts=shapes.reduce((n,s)=>n+s.pts.length,0);
    $('tCount').textContent=shapes.length+' shapes · '+pts+' points · '+cur.length+' in progress';
    $('tList').innerHTML=shapes.map((s,i)=>'<li><b>'+(s.name||'(unnamed)')+'</b><span>'+s.kind+' · '+s.pts.length+'</span></li>').join('');
    $('tOut').value=JSON.stringify(shapes,null,1);
  }
  function addPt(e,plan){
    if(plan!==planSpace())return;
    cur.push(plan?[+e.latlng.lat.toFixed(1),+e.latlng.lng.toFixed(1)]:[+e.latlng.lat.toFixed(7),+e.latlng.lng.toFixed(7)]);
    draw();
  }
  mapB.on('click',e=>addPt(e,true)); mapS.on('click',e=>addPt(e,false));
  $('tFinish').onclick=()=>{
    if(cur.length<2)return;
    shapes.push({name:$('tName').value.trim(),kind:$('tKind').value,space:planSpace()?'plan':'gps',pts:cur});
    cur=[]; $('tName').value=''; save(); draw();
  };
  $('tUndo').onclick=()=>{ cur.pop(); draw(); };
  $('tDel').onclick=()=>{ shapes.pop(); save(); draw(); };
  $('tClear').onclick=()=>{ if(confirm('Clear all traced shapes?')){ shapes=[]; cur=[]; save(); draw(); } };
  $('tCopy').onclick=()=>{ $('tOut').select(); document.execCommand('copy'); };
  $('tDown').onclick=()=>{
    const b=new Blob([JSON.stringify(shapes,null,1)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='eden-trace.json'; a.click();
  };
  document.addEventListener('keydown',ev=>{
    if(/^(INPUT|TEXTAREA|SELECT)$/.test(ev.target.tagName))return;
    if(ev.key==='Enter'){ev.preventDefault();$('tFinish').click();}
    if(ev.key==='Backspace'){ev.preventDefault();$('tUndo').click();}
  });
  mapB.on('zoomend moveend',draw); mapS.on('zoomend moveend',draw);
  bB.addEventListener('click',()=>{cur=[];setTimeout(draw,0);});
  bS.addEventListener('click',()=>{cur=[];setTimeout(draw,0);});
  draw();
}
if(new URLSearchParams(location.search).has('trace'))initTrace();
{const nm=(new URLSearchParams(location.search).get('name')||'').trim().toLowerCase();
 if(nm){const i=PEOPLE.findIndex(p=>p.n.trim().toLowerCase()===nm);
  if(i>=0)setTimeout(()=>{mapB.setView(mB[i].getLatLng(),0.75);mB[i].openPopup();},350);}}
document.addEventListener('keydown',ev=>{
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(ev.target.tagName))return;
  if(ev.shiftKey&&(ev.key==='T'||ev.key==='t'))initTrace();
});
window._b=mapB; window._s=mapS;
</script>
</body>
</html>
